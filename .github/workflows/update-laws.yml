name: Update laws.json

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 자정 자동 실행
  workflow_dispatch:       # 수동 실행도 가능

jobs:
  update-laws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch law dates
        env:
          LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, os, time

          api_key = os.environ.get('LAW_API_KEY', '')
          if not api_key:
              print("API 키 없음")
              exit(1)

          laws = [
              '개인정보보호법',
              '정보통신망이용촉진및정보보호등에관한법률',
              '신용정보의이용및보호에관한법률',
              '전자금융거래법',
              '전자서명법',
              '정보보호산업의진흥에관한법률',
              '전자정부법',
              '통신비밀보호법',
              '정보통신기반보호법',
              '사이버보안기본법',
              '클라우드컴퓨팅발전및이용자보호에관한법률',
              '위치정보의보호및이용등에관한법률',
              '저작권법',
          ]

          result = {}
          for law in laws:
              try:
                  url = f"https://www.law.go.kr/DRF/lawSearch.do?OC={api_key}&target=law&type=JSON&query={urllib.parse.quote(law)}&display=1"
                  import urllib.parse
                  url = f"https://www.law.go.kr/DRF/lawSearch.do?OC={api_key}&target=law&type=JSON&query={urllib.parse.quote(law)}&display=1"
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as res:
                      data = json.loads(res.read().decode('utf-8'))
                  item = data.get('LawSearch', {}).get('law', [])
                  if item:
                      d = item[0].get('공포일자', '')
                      if d:
                          formatted = f"{d[:4]}.{d[4:6]}.{d[6:8]}"
                          result[law] = formatted
                          print(f"✅ {law}: {formatted}")
                  time.sleep(0.5)
              except Exception as e:
                  print(f"❌ {law}: {e}")

          with open('laws.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          print("laws.json 저장 완료!")
          PYEOF

      - name: Commit laws.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add laws.json
          git diff --staged --quiet || git commit -m "Auto: laws.json 업데이트"
          git push
