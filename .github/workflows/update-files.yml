name: Update files.json

on:
  push:
    branches:
      - main

jobs:
  update-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate files.json
        run: |
          EXTENSIONS="pdf hwp hwpx docx doc xlsx xls pptx ppt txt html htm"

          scan_folder() {
            local folder="$1"
            local result="["
            local first=true
            if [ -d "$folder" ]; then
              while IFS= read -r -d '' file; do
                filename=$(basename "$file")
                ext="${filename##*.}"
                ext_lower=$(echo "$ext" | tr '[:upper:]' '[:lower:]')
                for e in $EXTENSIONS; do
                  if [ "$ext_lower" = "$e" ]; then
                    if [ "$first" = true ]; then
                      first=false
                    else
                      result="$result,"
                    fi
                    name_escaped=$(echo "$filename" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g')
                    path_escaped=$(echo "$folder/$filename" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g')
                    result="$result{\"name\":\"$name_escaped\",\"path\":\"$path_escaped\"}"
                    break
                  fi
                done
              done < <(find "$folder" -maxdepth 1 -type f -print0 | sort -z)
            fi
            result="$result]"
            echo "$result"
          }

          doc_privacy=$(scan_folder "개인정보보호")
          doc_policy=$(scan_folder "정보보호정책")
          doc_etc=$(scan_folder "기타")
          cert_security=$(scan_folder "자격증/정보보안기사")
          cert_isms=$(scan_folder "자격증/isms인증심사원")
          isms_defect=$(scan_folder "isms결함관리/결함문서")
          isms_guide=$(scan_folder "isms결함관리/조치가이드")

          cat > files.json << JSONEOF
          {
            "업무문서": {
              "개인정보보호": $doc_privacy,
              "정보보호정책": $doc_policy,
              "기타": $doc_etc
            },
            "자격증": {
              "정보보안기사": $cert_security,
              "isms인증심사원": $cert_isms
            },
            "isms결함관리": {
              "결함문서": $isms_defect,
              "조치가이드": $isms_guide
            }
          }
          JSONEOF

          echo "=== files.json 생성 완료 ==="
          cat files.json

      - name: Commit files.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add files.json
          git diff --staged --quiet || git commit -m "Auto: files.json 업데이트"
          git push
