<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🐢 거부기 키우기 🐢</title>
<!-- iOS에서 "홈 화면에 추가"로 앱처럼 쓸 수 있게 하는 설정 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="거부기 키우기">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #14140f;
    --surface1: #1d1d16;
    --surface2: #262620;
    --border: #34342b;
    --text-primary: #f3f2ea;
    --text-secondary: #a9a794;
    --text-muted: #757362;
    --amber: #ef9f27;
    --green: #7cb342;
    --bubble: #2a3a2e;
    --bubble-shine: rgba(255,255,255,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    overscroll-behavior: none; user-select: none; overflow: hidden; }
  #app { max-width: 460px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column;
    padding: max(env(safe-area-inset-top), 16px) 16px calc(env(safe-area-inset-bottom) + 16px); position: relative; }

  header { padding: 14px 4px 18px; text-align: center; }
  header h1 { font-size: 15px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.3px; }

  .stat-row { display: flex; gap: 10px; margin-bottom: 12px; margin-top: 4px; }
  .stat-box { flex: 1; background: var(--surface1); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; text-align: center; }
  .stat-box .n { font-size: 20px; font-weight: 600; }
  .stat-box .l { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .sheet-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
  .bubble-scroll {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    touch-action: pan-y;
  }
  #bubbleGrid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    width: 100%;
    background: var(--surface1);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    touch-action: none;
  }
  .bubble {
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, var(--bubble-shine), var(--bubble) 65%);
    box-shadow: inset 0 -2px 3px rgba(0,0,0,0.35);
    cursor: pointer;
    transition: transform 0.08s ease;
    touch-action: none;
  }
  .bubble:active { transform: scale(0.9); }
  .bubble.popped {
    background: var(--surface2);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .refill-hint { font-size: 12px; color: var(--text-muted); text-align: center; min-height: 16px; }
  .new-sheet-btn {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 12px; padding: 10px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
    flex-shrink: 0;
  }
  .new-sheet-btn:active { background: var(--border); }

  /* 전설의 거북이 - 화면 위에 떠서 드래그로 옮길 수 있음 */
  #turtleBox {
    position: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    cursor: grab;
    touch-action: none;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
  }
  #turtleBox:active { cursor: grabbing; }
  #turtleBox .turtle-emoji { line-height: 1; transition: width 0.15s ease, height 0.15s ease, transform 0.25s ease;
    display: block; -webkit-user-drag: none; user-select: none; pointer-events: none; }
  #turtleBox.bump { animation: bump 0.2s ease; }
  @keyframes bump { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes petHeart {
    0% { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
    30% { opacity: 1; transform: translate(-50%, -10px) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -34px) scale(1); }
  }

  #ascendOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.72);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px;
  }
  #ascendOverlay.show { display: flex; }
  .ascend-card {
    background: var(--surface1); border: 1px solid var(--border); border-radius: 20px;
    padding: 28px 24px; text-align: center; max-width: 320px; width: 100%;
  }
  .ascend-emoji { font-size: 46px; margin-bottom: 10px; }
  .ascend-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .ascend-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 18px; }
  .ascend-btn {
    background: var(--amber); color: #1a1200; border: none; border-radius: 12px;
    padding: 12px 0; width: 100%; font-size: 14px; font-weight: 700; cursor: pointer;
  }
</style>
</head>

  </div>

<script>
// ---------- 저장소 ----------
var memoryStore = {};
function capacitorPrefsAvailable() {
  return typeof window !== "undefined" && window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences;
}
function storageGet(key, fallback) {
  try {
    var v = localStorage.getItem(key);
    return v !== null ? JSON.parse(v) : fallback;
  } catch (e) {
    return memoryStore[key] !== undefined ? memoryStore[key] : fallback;
  }
}
function storageSet(key, value) {
  memoryStore[key] = value;
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  if (capacitorPrefsAvailable()) {
    try { window.Capacitor.Plugins.Preferences.set({ key: key, value: JSON.stringify(value) }); } catch (e) {}
  }
}

// ---------- 상태 ----------
// 이전 버전(알 -> 거북이 키우기)에서 쓰던 키를 그대로 재사용하면 그때 테스트하며 쌓인 값이
// 그대로 남아있어서 처음부터 420개처럼 보이는 문제가 생겨요. 그래서 새 네임스페이스로 분리했어요.
var totalPops = storageGet("bubbleturtle3:totalPops", 0);
var sheetsCleared = storageGet("bubbleturtle3:sheetsCleared", 0);
var ascendedCount = storageGet("bubbleturtle3:ascendedCount", 0);
var popsSinceAscension = storageGet("bubbleturtle3:popsSinceAscension", 0);

var MIN_SIZE = 30;        // 새로 태어난 거북이 크기(px)
var GROWTH_PER_POP = 0.6; // 뽁뽁이 한 번 터뜨릴 때마다 커지는 정도(px)

var ROWS = 10, COLS = 6; // ROWS는 initRowsToFitScreen()에서 화면에 맞춰 다시 계산됨
var GRID_PADDING = 14, GRID_GAP = 6; // #bubbleGrid CSS 값과 반드시 맞춰야 함

function computeRowsToFit() {
  var scrollBox = document.getElementById("bubbleScroll");
  var availWidth = scrollBox.clientWidth;
  var availHeight = scrollBox.clientHeight;
  if (availWidth <= 0 || availHeight <= 0) return ROWS; // 아직 레이아웃 전이면 기존 값 유지

  // .bubble-scroll 안에는 그리드 말고도 refill-hint 텍스트 자리(최소높이 16px)와
  // 그 사이 gap(10px)이 더 있어서, 그만큼 + 여유 버퍼를 미리 빼줘야 정확히 맞음
  var reserved = 10 + 16 + 6; // gap + refill-hint min-height + 여유 버퍼
  availHeight -= reserved;

  var cellSize = (availWidth - GRID_PADDING * 2 - GRID_GAP * (COLS - 1)) / COLS;
  if (cellSize <= 0) return ROWS;

  var rows = Math.floor((availHeight - GRID_PADDING * 2 + GRID_GAP) / (cellSize + GRID_GAP));
  return Math.max(5, Math.min(14, rows));
}
var poppedInSheet = 0;
var ascensionPending = false; // 승천 예약된 동안 중복으로 또 승천되는 것 방지

var turtleBox = document.getElementById("turtleBox");
var turtleEmoji = document.getElementById("turtleEmoji");
var turtleRotation = 0; // 현재 회전각(deg). 0 = 원본 그림 방향(약 8시 방향)

function faceTurtleTowards(targetX, targetY) {
  var rect = turtleBox.getBoundingClientRect();
  var cx = rect.left + rect.width / 2;
  var cy = rect.top + rect.height / 2;
  var dx = targetX - cx, dy = targetY - cy;
  if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return; // 거의 같은 위치면 회전 안 함
  var angle = Math.atan2(dy, dx) * 180 / Math.PI; // 0=오른쪽, 90=아래 기준
  var targetRotation = angle - 150; // 원본 그림이 8시 방향(≈150도)을 보고 있어서 그만큼 보정
  // 최단 경로로 회전(360도 넘게 뺑글 도는 것 방지)
  var delta = ((targetRotation - turtleRotation + 540) % 360) - 180;
  turtleRotation += delta;
  turtleEmoji.style.transform = "rotate(" + turtleRotation + "deg)";
}
var currentSize = MIN_SIZE;
var turtleLeft = 0, turtleTop = 0;

function countLabel(n) {
  return n + "마리";
}

function ascensionThreshold() {
  // 뽁뽁이판(그리드)의 절반 크기를 기준으로 승천 - 사용자가 눈으로 직접 비교하기 쉬움
  var grid = document.getElementById("bubbleGrid");
  if (grid) {
    var rect = grid.getBoundingClientRect();
    if (rect.width > 0 && rect.height > 0) {
      return Math.min(rect.width, rect.height) * 0.5;
    }
  }
  // 그리드 크기를 아직 못 구했을 때를 대비한 안전한 기본값
  return Math.min(window.innerWidth, window.innerHeight) * 0.25;
}

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function positionTurtle(left, top) {
  var maxLeft = window.innerWidth - currentSize;
  var maxTop = window.innerHeight - currentSize;
  turtleLeft = clamp(left, 0, Math.max(0, maxLeft));
  turtleTop = clamp(top, 0, Math.max(0, maxTop));
  turtleBox.style.left = turtleLeft + "px";
  turtleBox.style.top = turtleTop + "px";
}

function setTurtleSize(newSize) {
  var oldSize = currentSize;
  var centerX = turtleLeft + oldSize / 2;
  var centerY = turtleTop + oldSize / 2;
  currentSize = newSize;
  turtleBox.style.width = newSize + "px";
  turtleBox.style.height = newSize + "px";
  turtleEmoji.style.width = newSize + "px";
  turtleEmoji.style.height = newSize + "px";
  positionTurtle(centerX - newSize / 2, centerY - newSize / 2);
}

function initTurtle() {
  currentSize = MIN_SIZE + popsSinceAscension * GROWTH_PER_POP;
  currentSize = Math.min(currentSize, ascensionThreshold());
  turtleBox.style.width = currentSize + "px";
  turtleBox.style.height = currentSize + "px";
  turtleEmoji.style.width = currentSize + "px";
  turtleEmoji.style.height = currentSize + "px";
  positionTurtle((window.innerWidth - currentSize) / 2, window.innerHeight * 0.28);
  renderStats();
}

function renderStats() {
  document.getElementById("totalPops").textContent = totalPops;
  document.getElementById("ascendedCountLabel").textContent = ascendedCount + "마리";
}

function bumpTurtle() {
  turtleBox.classList.remove("bump");
  void turtleBox.offsetWidth; // 리플로우 강제 (애니메이션 재시작용)
  turtleBox.classList.add("bump");
}

function triggerAscension() {
  ascendedCount++;
  storageSet("bubbleturtle3:ascendedCount", ascendedCount);
  popsSinceAscension = 0;
  storageSet("bubbleturtle3:popsSinceAscension", popsSinceAscension);

  document.getElementById("ascendTitle").textContent =
    "거북이 " + countLabel(ascendedCount) + "를 승천시키셨습니다.";
  document.getElementById("ascendOverlay").classList.add("show");
}

document.getElementById("ascendConfirmBtn").addEventListener("click", function() {
  document.getElementById("ascendOverlay").classList.remove("show");
  setTurtleSize(MIN_SIZE);
  ascensionPending = false;
  renderStats();
});

// ---------- 거북이 드래그 + 쓰다듬기 ----------
var dragging = false, dragOffsetX = 0, dragOffsetY = 0;
var pointerStartX = 0, pointerStartY = 0, pointerStartTime = 0, pointerMoved = false;
var activePointerId = null;
turtleBox.addEventListener("pointerdown", function(e) {
  dragging = true;
  pointerMoved = false;
  activePointerId = e.pointerId;
  pointerStartX = e.clientX;
  pointerStartY = e.clientY;
  pointerStartTime = Date.now();
  dragOffsetX = e.clientX - turtleLeft;
  dragOffsetY = e.clientY - turtleTop;
  e.preventDefault();
});
// pointer capture가 사파리(특히 iOS)에서 불안정한 경우가 있어서,
// 이동 추적은 요소가 아니라 document 전체에서 하도록 함 (손가락이 거북이 밖으로 나가도 계속 따라감)
document.addEventListener("pointermove", function(e) {
  if (!dragging || e.pointerId !== activePointerId) return;
  if (Math.abs(e.clientX - pointerStartX) > 6 || Math.abs(e.clientY - pointerStartY) > 6) {
    pointerMoved = true;
  }
  positionTurtle(e.clientX - dragOffsetX, e.clientY - dragOffsetY);
});
function endDrag(e) {
  if (!dragging || (e.pointerId !== undefined && e.pointerId !== activePointerId)) return;
  dragging = false;
  activePointerId = null;
  // 거의 움직이지 않고 짧게 탭했으면 드래그가 아니라 "쓰다듬기"로 처리
  if (!pointerMoved && (Date.now() - pointerStartTime) < 500) {
    petTurtle();
  }
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

function petTurtle() {
  var heart = document.createElement("div");
  heart.textContent = "💚";
  heart.style.position = "absolute";
  heart.style.left = "50%";
  heart.style.top = "-6px";
  heart.style.transform = "translate(-50%, 0)";
  heart.style.fontSize = Math.max(16, Math.round(currentSize * 0.35)) + "px";
  heart.style.pointerEvents = "none";
  heart.style.animation = "petHeart 0.9s ease-out forwards";
  turtleBox.appendChild(heart);
  setTimeout(function() {
    if (heart.parentNode) heart.parentNode.removeChild(heart);
  }, 900);
}

window.addEventListener("resize", function() {
  // 화면 회전 등으로 크기가 바뀌면 승천 기준선도 다시 계산되고, 위치도 화면 안으로 다시 클램프
  positionTurtle(turtleLeft, turtleTop);
  var newRows = computeRowsToFit();
  if (newRows !== ROWS) {
    ROWS = newRows;
    buildSheet();
  }
});

// ---------- 뽁뽁이 소리 (외부 파일 없이 Web Audio로 생성) ----------
var audioCtx = null;
function playPop() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var ctx = audioCtx;
    var t = ctx.currentTime;

    // 마스터 게인 (전체 볼륨을 확 키움 - 이전보다 훨씬 큼)
    var master = ctx.createGain();
    master.gain.value = 1.0;
    master.connect(ctx.destination);

    // 1) 저음 통 - "펑" 하는 몸통 부분
    var osc = ctx.createOscillator();
    var oscGain = ctx.createGain();
    osc.type = "sine";
    var baseFreq = 150 + Math.random() * 30;
    osc.frequency.setValueAtTime(baseFreq, t);
    osc.frequency.exponentialRampToValueAtTime(45, t + 0.13);
    oscGain.gain.setValueAtTime(0.0001, t);
    oscGain.gain.exponentialRampToValueAtTime(0.9, t + 0.008); // 순간적으로 확 터지는 느낌
    oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
    osc.connect(oscGain).connect(master);
    osc.start(t);
    osc.stop(t + 0.18);

    // 2) 노이즈 버스트 - 터지는 질감(치찰음)
    var bufferSize = Math.floor(ctx.sampleRate * 0.06);
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    var noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = "bandpass";
    noiseFilter.frequency.value = 1500 + Math.random() * 500;
    noiseFilter.Q.value = 0.6;
    var noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.8, t);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    noise.connect(noiseFilter).connect(noiseGain).connect(master);
    noise.start(t);
  } catch (e) {}
}

// ---------- 뽁뽁이 판 ----------
var isSwipingBubbles = false;

function buildSheet() {
  var grid = document.getElementById("bubbleGrid");
  grid.innerHTML = "";
  poppedInSheet = 0;
  document.getElementById("refillHint").textContent = "";
  for (var i = 0; i < ROWS * COLS; i++) {
    var b = document.createElement("div");
    b.className = "bubble";
    b.addEventListener("pointerdown", function(e) {
      isSwipingBubbles = true;
      // 터치는 처음 닿은 요소에 암묵적으로 고정(capture)되는데, 그걸 풀어줘야
      // 손가락이 지나가는 다른 뽁뽁이들의 pointerenter가 정상적으로 발생함
      try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) {}
      onPop(e.currentTarget);
    });
    b.addEventListener("pointerenter", function(e) {
      if (isSwipingBubbles) onPop(e.currentTarget);
    });
    grid.appendChild(b);
  }
}
document.addEventListener("pointerup", function() { isSwipingBubbles = false; });
document.addEventListener("pointercancel", function() { isSwipingBubbles = false; });

document.getElementById("newSheetBtn").addEventListener("click", function() {
  buildSheet();
});

function onPop(el) {
  if (el.classList.contains("popped")) return;
  el.classList.add("popped");
  poppedInSheet++;
  totalPops++;
  popsSinceAscension++;
  storageSet("bubbleturtle3:totalPops", totalPops);
  storageSet("bubbleturtle3:popsSinceAscension", popsSinceAscension);
  playPop();
  renderStats();

  var bubbleRect = el.getBoundingClientRect();
  faceTurtleTowards(bubbleRect.left + bubbleRect.width / 2, bubbleRect.top + bubbleRect.height / 2);

  var threshold = ascensionThreshold();
  var nextSize = MIN_SIZE + popsSinceAscension * GROWTH_PER_POP;

  if (!ascensionPending) {
    if (nextSize >= threshold) {
      ascensionPending = true;
      setTurtleSize(threshold);
      bumpTurtle();
      setTimeout(triggerAscension, 350);
    } else {
      setTurtleSize(nextSize);
      bumpTurtle();
    }
  }
  // ascensionPending이 true인 동안(팝업 뜨기 전까지)은 거북이 크기 갱신/재예약을 건너뛰지만,
  // 판 완료 체크 등 나머지 로직은 그대로 진행됨

  if (poppedInSheet >= ROWS * COLS) {
    sheetsCleared++;
    storageSet("bubbleturtle3:sheetsCleared", sheetsCleared);
    document.getElementById("refillHint").textContent = "다 터뜨렸어요! 새 판 준비 중...";
    setTimeout(function() { buildSheet(); }, 500);
  }
}

ROWS = computeRowsToFit();
buildSheet();
initTurtle();
</script>
</body>
</html>
